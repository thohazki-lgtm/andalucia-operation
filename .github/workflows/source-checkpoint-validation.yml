name: Source checkpoint validation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - 'recovery/**'
      - 'checkpoint/**'
      - 'development/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Validate accumulated OFF migration
        run: npm run test:accumulated-off-026

      - name: Validate manual OT migration
        run: npm run test:manual-overtime-027

      - name: Validate official timesheet export
        run: npm run test:official-timesheet-export

      - name: Validate official timesheet download route
        run: npm run test:official-timesheet-export-route
